include theme.conf

font_family      family="UbuntuMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

# Points, where alacritty's 14 was pixels
window_padding_width 10.5

# Steady block, as alacritty; shell integration would make it a beam at the prompt
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor

enable_audio_bell       no
confirm_os_window_close 0

map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard

# Zoom as in alacritty
map ctrl+equal change_font_size current +1.0
map ctrl+plus  change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
map ctrl+0     change_font_size current 0
