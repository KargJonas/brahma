general.import = [ "~/.config/alacritty/theme.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "Ubuntu Mono Nerd Font", style = "Regular" }
bold = { family = "Ubuntu Mono Nerd Font", style = "Bold" }
italic = { family = "Ubuntu Mono Nerd Font", style = "Italic" }
size = 15

[window]
padding.x = 14
padding.y = 14
# decorations = "None"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
